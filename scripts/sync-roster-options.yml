name: Sync roster options

on:
  push:
    branches:
      - main
    paths:
      - content/cms/roster.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-roster-options-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-roster-options:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Commit changes if needed
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet admin/config.yml; then
            echo "Roster options already in sync."
            exit 0
          fi

          git add admin/config.yml
          git commit -m "Sync roster options in CMS config"

          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "CMS roster options synced."
              exit 0
            fi
            echo "Push failed, retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to push synced roster options after 3 attempts."
          exit 1
