<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autorizzazione TikTok — CUS Trento C5</title>
  <style>
    body { font:16px/1.5 system-ui,sans-serif; background:#f5f5f5; color:#181818; padding:2rem; }
    main { max-width:600px; margin:4rem auto; background:white; border-radius:16px; padding:2rem; }
    button { padding:0.9rem 1.4rem; border:0; border-radius:8px; background:#b91c1c; color:white; font-weight:bold; cursor:pointer; }
    #status { margin-top:1rem; }
  </style>
</head>
<body><main>
  <h1>Autorizzazione TikTok CUS Trento C5</h1>
  <p id="message">Questa pagina serve esclusivamente per collegare l'account del club al sito ufficiale.</p>
  <button id="copy" type="button" hidden>Copia URL di autorizzazione</button>
  <p id="status" role="status"></p>
</main>
<script>
  (() => {
    const params = new URLSearchParams(location.search);
    const url = location.href;
    const button = document.getElementById('copy');
    const message = document.getElementById('message');
    if (params.has('code') && params.has('state')) {
      message.textContent = "Autorizzazione ricevuta. Copia l'URL e incollalo nel comando locale 'activate'. Non inviarlo in chat o pubblicarlo.";
      button.hidden = false;
      button.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(url);
          history.replaceState(null, '', location.pathname);
          document.getElementById('status').textContent = 'URL copiato. Torna al terminale per completare il collegamento.';
          button.disabled = true;
        } catch {
          document.getElementById('status').textContent = 'Copia l’URL dalla barra degli indirizzi e torna al terminale.';
        }
      });
    } else if (params.has('error')) {
      message.textContent = "TikTok non ha autorizzato l'accesso. Controlla i permessi Login Kit e video.list nel portale Developers.";
    } else {
      message.textContent = 'Pagina di autorizzazione. Avvia la procedura dal comando locale autorizzato.';
    }
  })();
</script>
</body>
</html>
