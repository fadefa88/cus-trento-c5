name: Manual fallback deploy to VHosting via SSH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vhosting-manual-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Manual rsync fallback to VHosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH and rsync
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Prepare SSH key
        timeout-minutes: 2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          touch ~/.ssh/known_hosts
          ssh-keyscan -T 30 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify remote connection
        timeout-minutes: 2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o IPQoS=none \
            "$SSH_USER@$SSH_HOST" \
            "pwd && ls -la '$SSH_TARGET_DIR'"

      - name: Deploy via rsync
        timeout-minutes: 8
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Rsync attempt $attempt/3"

            if timeout 6m rsync -azvh \
              --delete-delay \
              --delay-updates \
              --partial \
              --partial-dir=.rsync-partial \
              --timeout=45 \
              --stats \
              -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o IPQoS=none" \
              --exclude ".git/" \
              --exclude ".github/" \
              --exclude "README.md" \
              --exclude "README-CLOUDFLARE-PAGES.md" \
              --exclude "scripts/" \
              --exclude "requirements-sportrentino.txt" \
              --exclude "run_import_sportrentino.bat" \
              ./ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR/"; then
                echo "Manual VHosting deploy completed."
                exit 0
            fi

            echo "Rsync failed or timed out. Retrying..."
            sleep $((attempt * 15))
          done

          echo "Manual VHosting deploy failed after 3 attempts."
          exit 1
