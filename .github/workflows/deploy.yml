name: Deploy to VHosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload website to VHosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: FTP connection test
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "test deploy" > __deploy_test.txt

          echo "Server: $FTP_SERVER"
          echo "Target dir: $FTP_SERVER_DIR"

          lftp -d <<EOF
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set ftp:ssl-allow no
          set net:max-retries 1
          set net:timeout 30

          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"

          pwd
          cls

          cd "$FTP_SERVER_DIR"
          pwd
          put __deploy_test.txt
          cls

          bye
          EOF
