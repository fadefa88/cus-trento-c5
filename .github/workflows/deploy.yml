name: Deploy to VHosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload website to VHosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy via FTP with lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "Deploy target server: $FTP_SERVER"
          echo "Deploy target dir: $FTP_SERVER_DIR"

          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set ftp:ssl-allow no
          set net:max-retries 2
          set net:timeout 60

          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"

          cd "$FTP_SERVER_DIR"

          mirror -R --only-newer --verbose --parallel=1 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob README.md \
            --exclude-glob __deploy_test.txt \
            ./ .

          bye
          EOF
