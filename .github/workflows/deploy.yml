name: Deploy to VHosting via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Upload website to VHosting via rsync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install SSH and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify remote connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o KexAlgorithms=curve25519-sha256@libssh.org \
            -o Ciphers=aes128-ctr \
            -o MACs=hmac-sha2-256 \
            -o IPQoS=none \
            "$SSH_USER@$SSH_HOST" \
            "pwd && ls -la '$SSH_TARGET_DIR'"

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o KexAlgorithms=curve25519-sha256@libssh.org -o Ciphers=aes128-ctr -o MACs=hmac-sha2-256 -o IPQoS=none" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "README.md" \
            --exclude "__deploy_test.txt" \
            --exclude "__deploy_probe.txt" \
            ./ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR/"

      - name: Public verification
        run: |
          echo "Homepage:"
          curl -I -L --max-time 30 "https://custrentocalcioa5.it" || true

          echo "data.json:"
          curl -I -L --max-time 30 "https://custrentocalcioa5.it/content/data.json?cb=$(date +%s)" || true
