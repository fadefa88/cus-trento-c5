name: Sync CMS data

on:
  push:
    branches:
      - main
    paths:
      - content/cms/*.json
      - .github/workflows/sync-roster-options.yml
      - scripts/sync_roster_options.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cms-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-cms-data:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Refine player name hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_shell = 'shell("Player profile",p.name,`<div class="breadcrumb"'
          new_shell = 'shell("Player profile",p.name,`<style>.head .title{display:none!important}</style><div class="breadcrumb"'
          if old_shell not in app:
              raise SystemExit('Player profile shell anchor not found')
          app = app.replace(old_shell, new_shell, 1)
          old_profile_name = '<h2>${p.name||\'\'}</h2>'
          new_profile_name = '<h2 class="player-profile-name">${rosterCardNameHtml(p)}</h2>'
          if old_profile_name not in app:
              raise SystemExit('Player profile name anchor not found')
          app = app.replace(old_profile_name, new_profile_name, 1)
          app_path.write_text(app, encoding='utf-8')

          css_path = Path('css/style.css')
          css = css_path.read_text(encoding='utf-8')
          old_given = '.player .card-pad h2.player-card-name > .player-card-given{font-size:27.333333px!important;line-height:1!important;font-weight:inherit}'
          new_given = '.player .card-pad h2.player-card-name > .player-card-given{font-size:27.333333px!important;line-height:1!important;font-weight:500!important}'
          if old_given not in css:
              raise SystemExit('Roster given-name CSS anchor not found')
          css = css.replace(old_given, new_given, 1)
          profile_rules = '\n.player-detail-heading h2.player-profile-name > .player-card-surname{font-size:inherit!important;line-height:inherit!important;font-weight:1000!important}\n.player-detail-heading h2.player-profile-name > .player-card-given{font-size:inherit!important;line-height:inherit!important;font-weight:500!important}\n'
          if '.player-detail-heading h2.player-profile-name > .player-card-given' not in css:
              css += profile_rules
          css_path.write_text(css, encoding='utf-8')

          gen_path = Path('scripts/generate_static_pages.py')
          gen = gen_path.read_text(encoding='utf-8')
          old_return = '    return render_shell(crumbs[1], title, body)\n'
          new_return = '    rendered = render_shell(crumbs[1], title, body)\n    if key == "roster":\n        rendered = rendered.replace(f\'<h1 class="title">{esc(title)}</h1>\', "")\n    return rendered\n'
          if old_return not in gen:
              raise SystemExit('Static roster detail return anchor not found')
          gen = gen.replace(old_return, new_return, 1)
          gen_path.write_text(gen, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('/css/style.css?v=roster-name-v49', '/css/style.css?v=roster-name-v50', 1)
          index = index.replace('/js/app.js?v=roster-name-v66', '/js/app.js?v=roster-name-v67', 1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Merge CMS content into frontend data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          data_path = root / 'content' / 'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8')) if data_path.exists() else {}

          cms_files = [
              'news.json',
              'roster.json',
              'fixtures.json',
              'u21-fixtures.json',
              'gallery-albums.json',
              'sponsors.json',
              'sponsor-packages.json',
              'staff.json',
              'videos.json',
              'club-history.json',
              'events.json',
          ]

          for name in cms_files:
              path = root / 'content' / 'cms' / name
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, dict):
                  data.update(payload)

          data_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit and push synced CMS data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add admin/config.yml content/data.json js/app.js css/style.css scripts/generate_static_pages.py index.html

          if git diff --cached --quiet; then
            echo "CMS data already in sync."
            exit 0
          fi

          git commit -m "Refine player name hierarchy and profile heading"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after the CMS sync commit."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "CMS data synced to main."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "Push failed, retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to push synced CMS data after 3 attempts. Check repository rules for GitHub Actions write access to main."
          exit 1
