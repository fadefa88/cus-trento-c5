name: Sync CMS data

on:
  push:
    branches:
      - main
    paths:
      - content/cms/*.json
      - .github/workflows/sync-roster-options.yml
      - scripts/sync_roster_options.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cms-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-cms-data:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Apply requested navigation cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No changes applied to {path}')
              p.write_text(text, encoding='utf-8')

          patch('js/site-navigation-rework.js', [
              ('    "matchday":"/matchday/",\n', ''),
              ('    "/matchday/":"matchday",\n', ''),
              ('      ["staff","Staff"],\n      ["stats","Statistiche"],\n      ["play-with-us","Gioca con noi"]', '      ["staff","Staff"],\n      ["play-with-us","Gioca con noi"]'),
              ('      ["coppa","Coppa"],\n      ["cnu","CNU"],\n      ["season-archive","Archivio stagioni"],\n      ["matchday","Matchday"]', '      ["coppa","Coppa"],\n      ["stats","Statistiche"],\n      ["cnu","CNU"],\n      ["season-archive","Archivio stagioni"]'),
              ('    stats:["Squadre","Statistiche","Numeri, rendimento e dati tecnici della stagione."],', '    stats:["Stagione","Statistiche","Numeri, rendimento e dati tecnici della stagione."],'),
              ('    matchday:["Stagione","Matchday","Informazioni utili per seguire le partite e vivere il giorno gara."],\n', ''),
              ('    if(["teams-overview","squad","staff","stats","play-with-us"].includes(base)) return "teams";\n    if(["fixtures","standings","coppa","cnu","season-archive","matchday"].includes(base)) return "season";', '    if(["teams-overview","squad","staff","play-with-us"].includes(base)) return "teams";\n    if(["fixtures","standings","coppa","stats","cnu","season-archive"].includes(base)) return "season";'),
              ('<td>${h(r.played || "-")}</td><td>${h(r.wins || "-")}</td><td>${h(r.draws || "-")}</td><td>${h(r.losses || "-")}</td><td>${h(r.goalsFor || "-")}</td><td>${h(r.goalsAgainst || "-")}</td><td>${h(r.goalDifference || r.note || "-")}</td>', '<td>${h(r.played ?? "-")}</td><td>${h(r.wins ?? "-")}</td><td>${h(r.draws ?? "-")}</td><td>${h(r.losses ?? "-")}</td><td>${h(r.goalsFor ?? "-")}</td><td>${h(r.goalsAgainst ?? "-")}</td><td>${h(r.goalDifference ?? r.note ?? "-")}</td>'),
          ])

          patch('js/app.js', [
              ('  {label:"Squadra",items:[["squad","Rosa"],["staff","Staff"],["stats","Statistiche"]]},\n  {label:"Stagione",items:[["fixtures","Calendario"],["standings","Classifica"],["coppa","Coppa"],["matchday","Matchday"]]},', '  {label:"Squadra",items:[["squad","Rosa"],["staff","Staff"]]},\n  {label:"Stagione",items:[["fixtures","Calendario"],["standings","Classifica"],["coppa","Coppa"],["stats","Statistiche"]]},'),
              ('  matchday:"/matchday/",\n', ''),
              ('    {title:"Squadre",links:[["/squadre/","Squadre"],["/squadra/","Rosa"],["/staff/","Staff"],["/statistiche/","Statistiche"],["/gioca-con-noi/","Gioca con noi"]]},\n    {title:"Stagione",links:[["/calendario/","Calendario"],["/classifica/","Classifica"],["/coppa/","Coppa"],["/cnu/","CNU"],["/archivio-stagioni/","Archivio stagioni"],["/matchday/","Matchday"]]},', '    {title:"Squadre",links:[["/squadre/","Squadre"],["/squadra/","Rosa"],["/staff/","Staff"],["/gioca-con-noi/","Gioca con noi"]]},\n    {title:"Stagione",links:[["/calendario/","Calendario"],["/classifica/","Classifica"],["/coppa/","Coppa"],["/statistiche/","Statistiche"],["/cnu/","CNU"],["/archivio-stagioni/","Archivio stagioni"]]},'),
              ('<button class="btn light" onclick="route(\'squad\')">Scopri la rosa</button><button class="btn ghost" onclick="route(\'matchday\')">Info matchday</button>', '<button class="btn light" onclick="route(\'squad\')">Scopri la rosa</button>'),
              ('else if(current==="staff")staff();else if(current==="matchday")matchday();else if(current==="gallery")gallery();', 'else if(current==="staff")staff();else if(current==="gallery")gallery();'),
          ])

          patch('scripts/generate_static_pages.py', [
              ('    {\n        "path": "/matchday/",\n        "route": "matchday",\n        "title": "Matchday CUS Trento C5",\n        "description": "Informazioni utili per seguire le partite casalinghe del CUS Trento C5.",\n        "heading": "Matchday",\n        "eyebrow": "Info partita",\n    },\n', ''),
          ])

          patch('index.html', [
              ('matchday:"/matchday/",', ''),
              ('/js/app.js?v=no-cookie-banner-v61', '/js/app.js?v=no-cookie-banner-v62'),
              ('/js/site-navigation-rework.js?v=menu-scroll-v57', '/js/site-navigation-rework.js?v=menu-scroll-v58'),
          ])

          patch('js/contact-security.js', [
              (' matchday:"/matchday/",', ''),
          ])

          matchday = Path('matchday/index.html')
          if matchday.exists():
              matchday.unlink()
              try:
                  matchday.parent.rmdir()
              except OSError:
                  pass
          PY

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Merge CMS content into frontend data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          data_path = root / 'content' / 'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8')) if data_path.exists() else {}

          cms_files = [
              'news.json',
              'roster.json',
              'fixtures.json',
              'u21-fixtures.json',
              'gallery-albums.json',
              'sponsors.json',
              'sponsor-packages.json',
              'staff.json',
              'videos.json',
              'club-history.json',
              'events.json',
          ]

          for name in cms_files:
              path = root / 'content' / 'cms' / name
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, dict):
                  data.update(payload)

          data_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit and push synced CMS data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add admin/config.yml content/data.json js/app.js js/site-navigation-rework.js js/contact-security.js scripts/generate_static_pages.py index.html
          git add -u matchday || true

          if git diff --cached --quiet; then
            echo "CMS data already in sync."
            exit 0
          fi

          git commit -m "Reorganize season navigation and remove matchday"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after the CMS sync commit."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "CMS data synced to main."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "Push failed, retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to push synced CMS data after 3 attempts. Check repository rules for GitHub Actions write access to main."
          exit 1
