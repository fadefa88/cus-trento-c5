name: Temporary news cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-roster-options.yml

permissions:
  contents: write

jobs:
  cleanup-news:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-sportrentino.txt
      - name: Improve article block deduplication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/import_sportrentino_news.py')
          text=path.read_text(encoding='utf-8')
          old='''        if txt in seen_blocks:\n            continue\n\n        # Evita blocchi sidebar/menu.'''
          new='''        if txt in seen_blocks:\n            continue\n\n        # HTML SporTrentino può essere malformato: un primo <p> può inglobare\n        # anche i paragrafi successivi. In quel caso find_all_next() li vede\n        # di nuovo singolarmente. Se il blocco corrente è già contenuto in un\n        # blocco precedente, non renderizzarlo una seconda volta.\n        if any(txt in previous for previous in seen_blocks):\n            continue\n\n        # Evita blocchi sidebar/menu.'''
          if old not in text:
              raise SystemExit('Dedup insertion point not found')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Refresh current page-one CUS articles with clean bodies
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sys
          import time
          from pathlib import Path
          import requests

          spec=importlib.util.spec_from_file_location('spor_import','scripts/import_sportrentino_news.py')
          imp=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=imp
          spec.loader.exec_module(imp)

          archive_path=Path('content/news.imported.json')
          payload=json.loads(archive_path.read_text(encoding='utf-8'))
          archive=payload.get('news',[]) if isinstance(payload,dict) else payload
          by_source={str(n.get('sourceUrl') or ''):n for n in archive if isinstance(n,dict) and n.get('sourceUrl')}
          by_source_id={str(n.get('sourceId') or ''):n for n in archive if isinstance(n,dict) and n.get('sourceId') is not None}

          session=requests.Session()
          source=imp.LIST_SOURCES[0]
          list_html=imp.fetch(session,imp.list_page_url(source,1))
          links=imp.extract_article_links(list_html)
          repaired=0
          for link in links:
              source_id=imp.article_id_from_url(link.url)
              previous=by_source.get(link.url) or by_source_id.get(source_id)
              if not previous:
                  continue
              article=imp.extract_article(session,link)
              if not article:
                  continue
              article['id']=previous.get('id',article.get('id'))
              if previous.get('slug'):
                  article['slug']=previous['slug']
              article['importSource']=previous.get('importSource',source['name'])
              key=imp.news_identity(previous)
              for i,item in enumerate(archive):
                  if imp.news_identity(item)==key:
                      archive[i]=article
                      repaired+=1
                      print('CLEANED',article.get('title'),'chars',len(str(article.get('bodyHtml') or '')))
                      break
              time.sleep(0.08)

          if isinstance(payload,dict):
              payload['news']=imp.sort_news(archive)
              archive_path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          else:
              archive_path.write_text(json.dumps(imp.sort_news(archive),ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          data=json.loads(Path('content/data.json').read_text(encoding='utf-8'))
          imp.save_news_index(Path('content/news.index.json'),imp.sort_news(data.get('news',[])+archive))
          print('Cleaned current archived articles:',repaired)
          if repaired==0:
              raise SystemExit('No current archived article was cleaned')
          PY
      - name: Regenerate and verify clean article
        shell: bash
        run: |
          python scripts/generate_static_pages.py
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('news/calcio-bleggio-dominante-nell-anticipo-riparte-la-serie-d-2026-09-25/index.html')
          html=path.read_text(encoding='utf-8')
          m=re.search(r'<article class="card card-pad article-body imported-article">([\s\S]*?)</article>',html)
          body=m.group(1) if m else ''
          text=re.sub(r'<[^>]+>',' ',body)
          text=re.sub(r'\s+',' ',text).strip()
          marker='CUS TRENTO U23 – SAN FLORIANO'
          occurrences=text.count(marker)
          print('Clean sample chars:',len(text),'marker occurrences:',occurrences)
          if len(text)<1500:
              raise SystemExit('Article became too short')
          if occurrences!=1:
              raise SystemExit(f'Article still contains duplicated nested blocks: {occurrences}')
          print('Clean article verification OK')
          PY
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean duplicated SporTrentino article bodies"
          git push origin HEAD:main
