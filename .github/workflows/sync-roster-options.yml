name: Temporary page heading and mobile result cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-roster-options.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ui:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update shared page headings and mobile match names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          style_path = Path('css/style.css')
          style = style_path.read_text(encoding='utf-8')
          marker = '/* Page title cleanup: hide shared eyebrow above main page title */'
          if marker not in style:
              style += '\n\n' + marker + '\n.head .eyebrow{display:none!important}\n'
              style_path.write_text(style, encoding='utf-8')

          upcoming_path = Path('css/home-upcoming-matches.css')
          upcoming = upcoming_path.read_text(encoding='utf-8')
          mobile_marker = '/* Mobile portrait: keep team names on one line in upcoming/results cards */'
          if mobile_marker not in upcoming:
              upcoming += '\n\n' + mobile_marker + '\n@media (max-width:520px) and (orientation:portrait){\n  .home-upcoming-team strong{\n    font-size:18px!important;\n    line-height:1!important;\n    white-space:nowrap!important;\n    display:block!important;\n    overflow:hidden!important;\n    text-overflow:ellipsis!important;\n    -webkit-line-clamp:unset!important;\n    -webkit-box-orient:initial!important;\n  }\n}\n'
              upcoming_path.write_text(upcoming, encoding='utf-8')

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(r'/css/style\.css\?v=[^\"\']+', '/css/style.css?v=page-head-v53', text)
              updated = re.sub(r'/css/home-upcoming-matches\.css\?v=[^\"\']+', '/css/home-upcoming-matches.css?v=home-upcoming-v20-mobile-nowrap', updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Remove page title badges and keep mobile match names single-line"
          git push origin HEAD:main
