name: Sync roster options

on:
  push:
    branches:
      - main
    paths:
      - content/cms/roster.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-roster-options-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-roster-options:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Create pull request if needed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Sync roster options in CMS config
          title: Sync roster options in CMS config
          body: |
            Aggiorna automaticamente i dropdown giocatori del CMS in base a content/cms/roster.json.

            Il branch main è protetto, quindi il workflow non prova più a fare push diretto su main: apre questa pull request da revisionare e unire.
          branch: chore/sync-roster-options
          delete-branch: true
          add-paths: admin/config.yml
