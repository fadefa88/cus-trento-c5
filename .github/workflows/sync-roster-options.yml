name: Sync CMS data

on:
  push:
    branches:
      - main
    paths:
      - content/cms/*.json
      - .github/workflows/sync-roster-options.yml
      - scripts/sync_roster_options.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cms-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-cms-data:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Apply surname-only labels and roster sizing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'function statShortName(p){return (p&&p.name?String(p.name):"").split(" ").slice(0,2).join(" ")||"Giocatore";}',
                  'function playerSurname(p){return (p&&p.name?String(p.name):"").trim().split(/\\s+/)[0]||"Giocatore";}\nfunction statShortName(p){return playerSurname(p);}\nfunction playerSurnameById(roster,id){const p=(roster||[]).find(x=>String(x.id)===String(id));return p?playerSurname(p):playerSurname({name:playerDisplayNameById(roster,id)});}'
              ),
              (
                  'const rows=(values||[]).map(x=>playerDisplayNameById(state.roster,resolvePlayerId(x,state.roster)||x)).filter(Boolean);',
                  'const rows=(values||[]).map(x=>playerSurnameById(state.roster,resolvePlayerId(x,state.roster)||x)).filter(Boolean);'
              ),
              (
                  'if(events.length)return events.map(e=>`<span class="match-person">${safe(playerDisplayNameById(state.roster,e.playerId))}${e.goals>1?` ${e.goals}`:""}</span>`).join("");',
                  'if(events.length)return events.map(e=>`<span class="match-person">${safe(playerSurnameById(state.roster,e.playerId))}${e.goals>1?` ${e.goals}`:""}</span>`).join("");'
              ),
              (
                  'return legacy.length?legacy.map(x=>`<span class="match-person">${safe(x)}</span>`).join(""):`<span class="match-person empty">Da definire</span>`;',
                  'return legacy.length?legacy.map(x=>`<span class="match-person">${safe(playerSurname({name:x}))}</span>`).join(""):`<span class="match-person empty">Da definire</span>`;'
              ),
              (
                  'if(events.length)return events.map(e=>`<span class="match-person">${safe(playerDisplayNameById(state.roster,e.playerId))}${e.count>1?` ${e.count}`:""}</span>`).join("");',
                  'if(events.length)return events.map(e=>`<span class="match-person">${safe(playerSurnameById(state.roster,e.playerId))}${e.count>1?` ${e.count}`:""}</span>`).join("");'
              ),
              (
                  '${starters.slice(0,5).map((name,i)=>`<div class="spot ${spots[i]||"p4"}">${playerDisplayNameById(state.roster,resolvePlayerId(name,state.roster)||name)}</div>`).join("")}',
                  '${starters.slice(0,5).map((name,i)=>`<div class="spot ${spots[i]||"p4"}">${playerSurnameById(state.roster,resolvePlayerId(name,state.roster)||name)}</div>`).join("")}'
              ),
          ]

          for old, new in replacements:
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one app.js occurrence, found {count}: {old[:100]}')
              app = app.replace(old, new, 1)

          app_path.write_text(app, encoding='utf-8')

          css_path = Path('css/style.css')
          css = css_path.read_text(encoding='utf-8')
          sizing = '\n/* Rosa: nomi ridotti di 2pt */\n.player .card-pad h2{font-size:calc(30px - 2pt)}\n.player-detail-heading h2{font-size:calc(42px - 2pt)}\n'
          if sizing.strip() not in css:
              css += sizing
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index_replacements = [
              ('/css/style.css?v=cus-static-seo-v45', '/css/style.css?v=cus-static-seo-v46'),
              ('/js/app.js?v=no-cookie-banner-v62', '/js/app.js?v=no-cookie-banner-v63'),
          ]
          for old, new in index_replacements:
              count = index.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one index.html occurrence, found {count}: {old}')
              index = index.replace(old, new, 1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Merge CMS content into frontend data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          data_path = root / 'content' / 'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8')) if data_path.exists() else {}

          cms_files = [
              'news.json',
              'roster.json',
              'fixtures.json',
              'u21-fixtures.json',
              'gallery-albums.json',
              'sponsors.json',
              'sponsor-packages.json',
              'staff.json',
              'videos.json',
              'club-history.json',
              'events.json',
          ]

          for name in cms_files:
              path = root / 'content' / 'cms' / name
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, dict):
                  data.update(payload)

          data_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit and push synced CMS data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add admin/config.yml content/data.json js/app.js css/style.css index.html

          if git diff --cached --quiet; then
            echo "CMS data already in sync."
            exit 0
          fi

          git commit -m "Use surnames in stats and match center"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after the CMS sync commit."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "CMS data synced to main."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "Push failed, retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to push synced CMS data after 3 attempts. Check repository rules for GitHub Actions write access to main."
          exit 1
