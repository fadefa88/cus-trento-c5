name: Temporary full news article rendering fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-roster-options.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-news:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix full article rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          gen_path = Path('scripts/generate_static_pages.py')
          gen = gen_path.read_text(encoding='utf-8')
          fn_start = gen.index('def article_body_html(item: Dict[str, Any]) -> str:')
          first_branch = '    if isinstance(item.get("contentBlocks"), list):'
          first_pos = gen.index(first_branch, fn_start)
          replacement = '    if item.get("bodyHtml"):\n        clean = re.sub(r"<script[\\s\\S]*?</script>", "", str(item["bodyHtml"]), flags=re.I)\n        clean = re.sub(r"<style[\\s\\S]*?</style>", "", clean, flags=re.I)\n        parts.append(clean)\n    elif isinstance(item.get("contentBlocks"), list):'
          gen = gen[:first_pos] + gen[first_pos:].replace(first_branch, replacement, 1)
          old_late = '    elif item.get("bodyHtml"):\n        clean = re.sub(r"<script[\\s\\S]*?</script>", "", str(item["bodyHtml"]), flags=re.I)\n        clean = re.sub(r"<style[\\s\\S]*?</style>", "", clean, flags=re.I)\n        parts.append(clean)\n'
          if old_late not in gen:
              raise SystemExit('Late bodyHtml branch not found')
          gen = gen.replace(old_late, '', 1)
          gen_path.write_text(gen, encoding='utf-8')

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          boot_old = 'async function bootData(){\n  let dataLoaded = false;\n  let loadError = null;'
          boot_new = 'async function bootData(){\n  let dataLoaded = false;\n  let loadError = null;\n  const preservePrerenderedArticle = String(current||"").startsWith("article-") && app && app.dataset.prerendered === "true";'
          if boot_old not in app:
              raise SystemExit('bootData header not found')
          app = app.replace(boot_old, boot_new, 1)
          render_old = '\n  render();\n\n  if(!dataLoaded && app){'
          render_new = '\n  if(!preservePrerenderedArticle) render();\n\n  if(!dataLoaded && app){'
          if render_old not in app:
              raise SystemExit('bootData final render not found')
          app = app.replace(render_old, render_new, 1)
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_version = '/js/app.js?v=internal-shell-v68'
          if old_version not in index:
              raise SystemExit('Expected app.js cache key not found in index.html')
          index_path.write_text(index.replace(old_version, '/js/app.js?v=news-full-v69'), encoding='utf-8')
          PY

      - name: Verify full article source is preferred
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location('gen', 'scripts/generate_static_pages.py')
          gen = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gen)
          data = gen.load_site_data()
          candidates = [n for n in data.get('news', []) if isinstance(n, dict) and len(str(n.get('bodyHtml') or '')) > 500]
          print('Articles with bodyHtml >500 chars:', len(candidates))
          if not candidates:
              raise SystemExit('No imported article with full bodyHtml found')
          item = candidates[0]
          rendered = gen.article_body_html(item)
          print('Verified article:', item.get('title'))
          print('excerpt chars:', len(str(item.get('excerpt') or '')), 'bodyHtml chars:', len(str(item.get('bodyHtml') or '')), 'rendered chars:', len(rendered))
          if len(rendered) <= len(str(item.get('excerpt') or '')) + 300:
              raise SystemExit('Rendered article still looks like an excerpt')
          if str(item.get('bodyHtml') or '')[:120] not in rendered:
              raise SystemExit('Full bodyHtml is not the preferred rendered source')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js scripts/generate_static_pages.py index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Restore full news article content"
          git push origin HEAD:main
