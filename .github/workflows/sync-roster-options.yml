name: Sync CMS data

on:
  push:
    branches:
      - main
    paths:
      - content/cms/*.json
      - .github/workflows/sync-roster-options.yml
      - scripts/sync_roster_options.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cms-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-cms-data:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Remove goalkeeper minutes field from CMS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin/config.yml')
          text = path.read_text(encoding='utf-8')
          block = '        - label: Minuti\n          name: minutes\n          widget: number\n          value_type: int\n          default: 40\n          min: 0\n'
          count = text.count(block)
          if count != 2:
              raise SystemExit(f'Expected 2 goalkeeper minutes fields, found {count}')
          path.write_text(text.replace(block, ''), encoding='utf-8')
          PY

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Merge CMS content into frontend data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          data_path = root / 'content' / 'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8')) if data_path.exists() else {}
          cms_files = [
              'news.json', 'roster.json', 'fixtures.json', 'u21-fixtures.json',
              'gallery-albums.json', 'sponsors.json', 'sponsor-packages.json',
              'staff.json', 'videos.json', 'club-history.json', 'events.json',
          ]
          for name in cms_files:
              path = root / 'content' / 'cms' / name
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, dict):
                  data.update(payload)
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit and push synced CMS data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/config.yml content/data.json
          if git diff --cached --quiet; then
            echo "CMS data already in sync."
            exit 0
          fi
          git commit -m "Remove goalkeeper minutes field from CMS"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after the CMS sync commit."
            git status --short
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "CMS data synced to main."
                exit 0
              fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep 3
          done
          exit 1
