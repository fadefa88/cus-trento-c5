name: Sync CMS data

on:
  push:
    branches:
      - main
    paths:
      - content/cms/*.json
      - .github/workflows/sync-roster-options.yml
      - scripts/sync_roster_options.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cms-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-cms-data:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Fix roster name sizing and merge match center callups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import html
          import re

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          anchor = '  const starters=lineup.startingFive||[];\n  const spots=["gk","p1","p2","p3","p4"];'
          replacement = '  const starters=lineup.startingFive||[];\n  const callups=[...starters,...(lineup.bench||[])].filter((value,index,all)=>all.findIndex(x=>String(x)===String(value))===index);\n  const spots=["gk","p1","p2","p3","p4"];'
          if anchor not in app:
              raise SystemExit('Unable to locate match callups anchor in js/app.js')
          app = app.replace(anchor, replacement, 1)
          old_block = '<h2>Convocati</h2><div class="grid grid-2 match-list-grid" style="margin-top:18px"><div><b>Quintetto</b><p class="muted match-person-list">${matchPeopleList(starters)}</p></div><div><b>Panchina</b><p class="muted match-person-list">${matchPeopleList(lineup.bench||[])}</p></div></div>'
          new_block = '<h2>Convocati</h2><p class="muted match-person-list" style="margin-top:18px">${matchPeopleList(callups)}</p>'
          if old_block not in app:
              raise SystemExit('Unable to locate Convocati split block in js/app.js')
          app = app.replace(old_block, new_block, 1)
          app_path.write_text(app, encoding='utf-8')

          css_path = Path('css/style.css')
          css = css_path.read_text(encoding='utf-8')
          old_css = '''/* Rosa: cognome pieno, nome 2pt più piccolo */
.player .card-pad h2.player-card-name{font-size:30px!important;line-height:1;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.player-card-surname{font-size:30px;font-weight:inherit}
.player-card-given{font-size:27.333px;font-weight:inherit}'''
          new_css = '''/* Rosa: cognome pieno, nome 2pt più piccolo */
.player .card-pad h2.player-card-name{font-size:30px!important;line-height:1!important;display:inline-flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.player .card-pad h2.player-card-name > .player-card-surname{font-size:30px!important;line-height:1!important;font-weight:inherit}
.player .card-pad h2.player-card-name > .player-card-given{font-size:27.333333px!important;line-height:1!important;font-weight:inherit}'''
          if old_css not in css:
              raise SystemExit('Unable to locate roster card CSS in css/style.css')
          css = css.replace(old_css, new_css, 1)
          css_path.write_text(css, encoding='utf-8')

          gen_path = Path('scripts/generate_static_pages.py')
          gen = gen_path.read_text(encoding='utf-8')
          helper_anchor = '''def public_youth_text(value: Any) -> str:
    text = str(value or "")
    text = re.sub(r"\\bunder\\s*21\\b", "Under 23", text, flags=re.I)
    return re.sub(r"\\bu21\\b", "U23", text, flags=re.I)
'''
          helper = helper_anchor + '''\n\ndef roster_card_name_html(value: Any) -> str:
    parts = str(value or "").strip().split()
    if not parts:
        return '<h2 class="player-card-name"></h2>'
    surname_len = 2 if len(parts) >= 2 and parts[0].lower() == "baccaro" and parts[1].lower() == "zeni" else 1
    surname = " ".join(parts[:surname_len])
    given = " ".join(parts[surname_len:])
    given_html = f' <span class="player-card-given">{esc(given)}</span>' if given else ""
    return f'<h2 class="player-card-name"><span class="player-card-surname">{esc(surname)}</span>{given_html}</h2>'
'''
          if helper_anchor not in gen:
              raise SystemExit('Unable to locate public_youth_text in static generator')
          if 'def roster_card_name_html' not in gen:
              gen = gen.replace(helper_anchor, helper, 1)
          old_static = '''f\'\'\'<article class="card player"><div class="player-top"><div class="avatar"><img loading="lazy" decoding="async" src="{esc(p.get('photo') or '/img/placeholder.webp')}" alt="{esc(p.get('name'))}"></div></div><div class="card-pad"><span class="badge">{esc(p.get('role'))}</span><h2>{esc(p.get('name'))}</h2><p class="muted">{esc(public_youth_text(p.get('team')))}</p></div></article>\'\'\''''
          new_static = '''f\'\'\'<article class="card player"><div class="player-top"><div class="avatar"><img loading="lazy" decoding="async" src="{esc(p.get('photo') or '/img/placeholder.webp')}" alt="{esc(p.get('name'))}"></div></div><div class="card-pad"><span class="badge">{esc(p.get('role'))}</span>{roster_card_name_html(p.get('name'))}<p class="muted">{esc(public_youth_text(p.get('team')))}</p></div></article>\'\'\''''
          if old_static not in gen:
              raise SystemExit('Unable to locate static roster card markup')
          gen = gen.replace(old_static, new_static, 1)
          gen_path.write_text(gen, encoding='utf-8')

          def split_name(name: str) -> str:
              parts = str(name or '').strip().split()
              if not parts:
                  return '<h2 class="player-card-name"></h2>'
              surname_len = 2 if len(parts) >= 2 and parts[0].lower() == 'baccaro' and parts[1].lower() == 'zeni' else 1
              surname = ' '.join(parts[:surname_len])
              given = ' '.join(parts[surname_len:])
              given_html = f' <span class="player-card-given">{html.escape(given)}</span>' if given else ''
              return f'<h2 class="player-card-name"><span class="player-card-surname">{html.escape(surname)}</span>{given_html}</h2>'

          squad_path = Path('squadra/index.html')
          squad = squad_path.read_text(encoding='utf-8')
          roster = json.loads(Path('content/cms/roster.json').read_text(encoding='utf-8')).get('roster', [])
          replaced = 0
          for player in roster:
              name = str(player.get('name') or '')
              old = f'<h2>{html.escape(name)}</h2>'
              if old in squad:
                  squad = squad.replace(old, split_name(name), 1)
                  replaced += 1
          if replaced == 0:
              raise SystemExit('No prerendered roster names were updated in squadra/index.html')
          squad = re.sub(r'/css/style\.css\?v=[^"\']+', '/css/style.css?v=roster-name-v49', squad, count=1)
          squad = re.sub(r'/js/app\.js\?v=[^"\']+', '/js/app.js?v=roster-name-v66', squad, count=1)
          squad_path.write_text(squad, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'/css/style\.css\?v=[^"\']+', '/css/style.css?v=roster-name-v49', index, count=1)
          index = re.sub(r'/js/app\.js\?v=[^"\']+', '/js/app.js?v=roster-name-v66', index, count=1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Merge CMS content into frontend data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          data_path = root / 'content' / 'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8')) if data_path.exists() else {}

          cms_files = [
              'news.json',
              'roster.json',
              'fixtures.json',
              'u21-fixtures.json',
              'gallery-albums.json',
              'sponsors.json',
              'sponsor-packages.json',
              'staff.json',
              'videos.json',
              'club-history.json',
              'events.json',
          ]

          for name in cms_files:
              path = root / 'content' / 'cms' / name
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, dict):
                  data.update(payload)

          data_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit and push synced CMS data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add admin/config.yml content/data.json js/app.js css/style.css index.html squadra/index.html scripts/generate_static_pages.py

          if git diff --cached --quiet; then
            echo "CMS data already in sync."
            exit 0
          fi

          git commit -m "Merge match center callups and fix roster name sizing"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after the CMS sync commit."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "CMS data synced to main."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "Push failed, retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to push synced CMS data after 3 attempts. Check repository rules for GitHub Actions write access to main."
          exit 1
