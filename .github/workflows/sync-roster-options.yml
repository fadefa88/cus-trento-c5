name: Sync CMS data

on:
  push:
    branches:
      - main
    paths:
      - content/cms/*.json
      - .github/workflows/sync-roster-options.yml
      - scripts/sync_roster_options.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cms-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-cms-data:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Apply roster stats isolation and goalkeeper presence fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'function isGoalkeeperPlayer(p){return !!p && (p.role==="Portiere"||!!p.goalkeeperStats);}',
                  'function isGoalkeeperPlayer(p){return !!p && (p.role==="Portiere"||!!p.goalkeeperStats);}\nfunction playerMatchesMatchTeam(p,teamKey){const t=normText(p&&p.team);return teamKey==="u21"?(t==="under21"||t==="under23"):t==="primasquadra";}'
              ),
              (
                  'const appearances=(ev&&typeof ev==="object"&&ev.appearances===0)?0:1;',
                  'const appearances=toNumber(goalsAgainst)>0?1:((ev&&typeof ev==="object"&&ev.appearances===0)?0:1);'
              ),
              (
                  'const isNonStartingGoalkeeper=isGoalkeeperPlayer(p)&&!startingIds.has(String(id));\n      if(!isNonStartingGoalkeeper){',
                  'const isNonStartingGoalkeeper=isGoalkeeperPlayer(p)&&!startingIds.has(String(id));\n      if(playerMatchesMatchTeam(p,teamKey)&&!isNonStartingGoalkeeper){'
              ),
              (
                  'if(p.history&&p.history[0])p.history[0].goals=toNumber(p.history[0].goals)+e.goals;\n      if(teamKey==="prima")addMap(goalMap,e.playerId,e.goals);',
                  'if(p.history&&p.history[0])p.history[0].goals=toNumber(p.history[0].goals)+e.goals;\n      }\n      if(teamKey==="prima")addMap(goalMap,e.playerId,e.goals);'
              ),
              (
                  'const p=byId.get(String(e.playerId));if(!p)return;\n      p.goals=toNumber(p.goals)+e.goals;',
                  'const p=byId.get(String(e.playerId));if(!p)return;\n      if(playerMatchesMatchTeam(p,teamKey)){\n      p.goals=toNumber(p.goals)+e.goals;'
              ),
              (
                  'yellowCardEvents(match,out.roster).forEach(e=>{const p=byId.get(String(e.playerId));if(p)addCards(p,comp,e.count,0);});',
                  'yellowCardEvents(match,out.roster).forEach(e=>{const p=byId.get(String(e.playerId));if(p&&playerMatchesMatchTeam(p,teamKey))addCards(p,comp,e.count,0);});'
              ),
              (
                  'redCardEvents(match,out.roster).forEach(e=>{const p=byId.get(String(e.playerId));if(p)addCards(p,comp,0,e.count);});',
                  'redCardEvents(match,out.roster).forEach(e=>{const p=byId.get(String(e.playerId));if(p&&playerMatchesMatchTeam(p,teamKey))addCards(p,comp,0,e.count);});'
              ),
              (
                  'const gk=byId.get(String(e.playerId));if(!gk||!gk.goalkeeperStats)return;\n      const gs=gk.goalkeeperStats;',
                  'const gk=byId.get(String(e.playerId));if(!gk||!gk.goalkeeperStats||!playerMatchesMatchTeam(gk,teamKey))return;\n      const eventAppearance=toNumber(e.appearances)>0?1:0;\n      if(eventAppearance>0&&!startingIds.has(String(e.playerId))){\n        gk.appearances=toNumber(gk.appearances)+1;\n        gk.competitions[comp].appearances=toNumber(gk.competitions[comp].appearances)+1;\n        gk.competitions.totale.appearances=toNumber(gk.competitions.totale.appearances)+1;\n        if(gk.history&&gk.history[0])gk.history[0].appearances=toNumber(gk.history[0].appearances)+1;\n      }\n      const gs=gk.goalkeeperStats;'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Merge CMS content into frontend data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          data_path = root / 'content' / 'data.json'
          data = json.loads(data_path.read_text(encoding='utf-8')) if data_path.exists() else {}

          cms_files = [
              'news.json',
              'roster.json',
              'fixtures.json',
              'u21-fixtures.json',
              'gallery-albums.json',
              'sponsors.json',
              'sponsor-packages.json',
              'staff.json',
              'videos.json',
              'club-history.json',
              'events.json',
          ]

          for name in cms_files:
              path = root / 'content' / 'cms' / name
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, dict):
                  data.update(payload)

          data_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit and push synced CMS data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add admin/config.yml content/data.json js/app.js

          if git diff --cached --quiet; then
            echo "CMS data already in sync."
            exit 0
          fi

          git commit -m "Isolate roster stats by team and count active goalkeepers"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after the CMS sync commit."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "CMS data synced to main."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "Push failed, retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to push synced CMS data after 3 attempts. Check repository rules for GitHub Actions write access to main."
          exit 1
