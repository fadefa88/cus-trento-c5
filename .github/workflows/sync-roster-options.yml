name: Sync roster options

on:
  push:
    branches:
      - main
    paths:
      - content/cms/roster.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-roster-options-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-roster-options:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Sync CMS player dropdowns from roster
        run: python scripts/sync_roster_options.py

      - name: Commit and push synced roster options
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add admin/config.yml

          if git diff --cached --quiet; then
            echo "Roster options already in sync."
            exit 0
          fi

          git commit -m "Sync roster options in CMS config"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after the roster sync commit."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "CMS roster options synced to main."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "Push failed, retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to push synced roster options after 3 attempts. Check repository rules for GitHub Actions write access to main."
          exit 1
