name: Temporary player profile name layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-roster-options.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-profile-name:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update player profile name layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('css/style.css')
          css = css_path.read_text(encoding='utf-8')
          old = '.player-detail-heading h2.player-profile-name > .player-card-surname{font-size:inherit!important;line-height:inherit!important;font-weight:1000!important}\n.player-detail-heading h2.player-profile-name > .player-card-given{font-size:inherit!important;line-height:inherit!important;font-weight:500!important}'
          new = '.player-detail-heading h2.player-profile-name{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:0!important;line-height:.86!important;margin:0!important}\n.player-detail-heading h2.player-profile-name > .player-card-surname{order:2;font-size:inherit!important;line-height:.86!important;font-weight:1000!important}\n.player-detail-heading h2.player-profile-name > .player-card-given{order:1;font-size:calc(1em - 3px)!important;line-height:.86!important;font-weight:500!important;margin-bottom:-1px}'
          if old not in css:
              raise SystemExit('Player profile name CSS anchor not found')
          css_path.write_text(css.replace(old, new, 1), encoding='utf-8')

          targets = [Path('index.html'), Path('squadra/index.html')]
          targets.extend(sorted(Path('squadra').glob('*/index.html')))
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/css/style\\.css\\?v=[^\"\']+', '/css/style.css?v=profile-name-v51', text, count=1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css index.html squadra
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Stack player profile name above surname"
          git push origin HEAD:main
