name: Sync roster options

on:
  push:
    branches:
      - main
    paths:
      - content/cms/roster.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-roster-options-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-roster-options:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Check CMS player dropdowns from roster
        id: sync-check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_roster_options.py

          if git diff --quiet -- admin/config.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Roster options already in sync."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff -- admin/config.yml > sync-roster-options.patch
          echo "::warning::admin/config.yml is not in sync with content/cms/roster.json. The repository rules block GitHub Actions from pushing to main or creating a branch, so this workflow reports the diff without failing."

          {
            echo "## Sync roster options"
            echo ""
            echo "admin/config.yml needs to be synchronized with content/cms/roster.json."
            echo ""
            echo "This workflow no longer pushes or creates a branch because repository rules block both direct updates to main and new refs from GitHub Actions."
            echo ""
            echo "Apply the generated diff manually, or relax the repository rules to allow GitHub Actions to create the sync branch."
            echo ""
            echo '```diff'
            cat sync-roster-options.patch
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync diff
        if: steps.sync-check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sync-roster-options.patch
          path: sync-roster-options.patch
