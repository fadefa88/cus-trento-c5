name: Update standings

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours, off the exact hour to avoid scheduler congestion.
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: update-standings-main
  cancel-in-progress: true

jobs:
  update-standings:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-sportrentino.txt

      - name: Update standings from SporTrentino
        run: |
          python scripts/update_standings.py --data content/data.json

      - name: Validate JSON
        run: |
          python -m json.tool content/data.json > /dev/null

      - name: Generate static SEO pages
        run: |
          python scripts/generate_static_pages.py
          test -f sitemap.xml
          test -f robots.txt

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # This job runs from a clean checkout. Stage the complete generated
          # diff so new static-page directories cannot be left unstaged.
          git add -A

          if git diff --cached --quiet; then
            echo "No standings or generated SEO page changes to commit."
            exit 0
          fi

          echo "Changes to commit:"
          git status --short
          git commit -m "Update standings"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after the standings commit."
            git status --short
            exit 1
          fi

          BRANCH="${GITHUB_REF_NAME:-main}"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH"; then
              if git push origin HEAD:"$BRANCH"; then
                echo "Standings update pushed."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 10))
          done

          echo "Push failed after 3 attempts."
          exit 1
