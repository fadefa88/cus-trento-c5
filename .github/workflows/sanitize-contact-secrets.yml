name: Sanitize contact form secrets

on:
  push:
    branches:
      - main
    paths:
      - "js/app.js"
      - ".github/workflows/sanitize-contact-secrets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanitize-contact-secrets-main
  cancel-in-progress: true

jobs:
  sanitize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove direct form secrets from source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("js/app.js")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'const CONTACT_FORM_ENDPOINT="[^"]*";', 'const CONTACT_FORM_ENDPOINT="/api/contact";', text)
          text = re.sub(r'const CONTACT_FORM_ACCESS_KEY="[^"]*";', 'const CONTACT_FORM_ACCESS_KEY="";', text)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit sanitized source if needed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet js/app.js; then
            echo "No contact secrets found in source."
            exit 0
          fi

          git add js/app.js
          git commit -m "Remove contact form secret from source"
          git pull --rebase origin main
          git push origin HEAD:main
