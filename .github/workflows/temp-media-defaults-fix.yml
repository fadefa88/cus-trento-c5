name: Apply media defaults and YouTube live fix

on:
  push:
    paths:
      - '.github/workflows/temp-media-defaults-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch media handling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          old = '      else if(u.pathname.includes("/shorts/")) id=u.pathname.split("/shorts/")[1].split("/")[0];'
          new = old + '\n      else if(u.pathname.includes("/live/")) id=u.pathname.split("/live/")[1].split("/")[0];'
          if old not in app:
              raise SystemExit('YouTube shorts parser anchor not found')
          if 'u.pathname.includes("/live/")' not in app:
              app = app.replace(old, new, 1)
          app_path.write_text(app, encoding='utf-8')

          config_path = Path('admin/config.yml')
          config = config_path.read_text(encoding='utf-8')

          def set_media_default(text, collection):
              marker = f'- name: {collection}\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Collection not found: {collection}')
              end = text.find('\n- name: ', start + len(marker))
              if end < 0:
                  end = len(text)
              section = text[start:end]
              old_default = '        default: 2025/26'
              if old_default not in section:
                  if '        default: 2026/27' in section:
                      return text
                  raise SystemExit(f'Season default not found for {collection}')
              section = section.replace(old_default, '        default: 2026/27', 1)
              return text[:start] + section + text[end:]

          config = set_media_default(config, 'galleryAlbums')
          config = set_media_default(config, 'videos')
          config_path.write_text(config, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check js/app.js

      - name: Verify changes
        shell: bash
        run: |
          grep -F 'u.pathname.includes("/live/")' js/app.js
          python <<'PY'
          from pathlib import Path
          text=Path('admin/config.yml').read_text(encoding='utf-8')
          for collection in ('galleryAlbums','videos'):
              start=text.index(f'- name: {collection}\n')
              end=text.find('\n- name: ', start+1)
              section=text[start:end if end >= 0 else len(text)]
              assert 'default: 2026/27' in section
          print('Media defaults verified')
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-media-defaults-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js admin/config.yml .github/workflows/temp-media-defaults-fix.yml
          git commit -m 'Fix YouTube live URLs and current media defaults'
          git push origin HEAD:main
