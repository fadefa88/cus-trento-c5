name: Update Instagram feed

on:
workflow_dispatch:
schedule:
- cron: "17 * * * *"

permissions:
contents: write

jobs:
update-instagram-feed:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      token: ${{ secrets.GH_PAT }}
      fetch-depth: 0

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests

  - name: Update Instagram feed from RSS.app
    run: |
      python scripts/update_instagram_feed.py \
        --feed-url "https://rss.app/feeds/v1.1/ZARGBanc4ELDomJR.json" \
        --limit 4 \
        --feed content/social-feed.json

  - name: Validate JSON
    run: |
      python -m json.tool content/social-feed.json > /dev/null

  - name: Commit and push changes
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

      if git diff --quiet content/social-feed.json; then
        echo "No Instagram feed changes to commit."
        exit 0
      fi

      git add content/social-feed.json
      git commit -m "Update Instagram social feed"

      BRANCH="${GITHUB_REF_NAME:-main}"
      git pull --rebase origin "$BRANCH"
      git push origin HEAD:"$BRANCH"
```
