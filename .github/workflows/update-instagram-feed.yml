name: Update Instagram feed from widgets

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Instagram widget source to scrape"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - both
          - elfsight
          - embedsocial
  schedule:
    # Every 24 hours. Uses Elfsight + EmbedSocial as data sources. Only Elfsight and EmbedSocial are used.
    - cron: "23 5 * * *"

permissions:
  contents: write

jobs:
  update-instagram-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Update Instagram feed from Elfsight and EmbedSocial
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          if [ -z "$SOURCE" ]; then
            SOURCE="auto"
          fi

          python scripts/update_instagram_feed.py \
            --source "$SOURCE" \
            --elfsight-app-id "017a8b39-9a1b-46d1-b742-cb533321bea1" \
            --embedsocial-ref "9abb7ef43c2b80e9cc04e6d7b00fb4d4ebd3e83b" \
            --limit 12 \
            --feed content/social-feed.json

      - name: Validate JSON
        run: |
          python -m json.tool content/social-feed.json > /dev/null

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet content/social-feed.json img/social; then
            echo "No social feed changes to commit."
            exit 0
          fi

          git add content/social-feed.json img/social
          git commit -m "Update Instagram feed"

          BRANCH="${GITHUB_REF_NAME:-main}"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              echo "Instagram feed update pushed."
              exit 0
            fi
            sleep 3
          done

          echo "Push failed after 3 attempts."
          exit 1
