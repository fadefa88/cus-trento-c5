name: Update social feed from widgets

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Instagram widget source to scrape"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - both
          - elfsight
          - embedsocial
  schedule:
    # Every 24 hours. Imports Instagram from Elfsight/EmbedSocial and TikTok from RSS-Bridge JSON.
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-social-feed-main
  cancel-in-progress: true

jobs:
  update-social-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Update Instagram and TikTok social feed
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          if [ -z "$SOURCE" ]; then
            SOURCE="auto"
          fi

          python scripts/update_instagram_feed.py \
            --source "$SOURCE" \
            --elfsight-app-id "017a8b39-9a1b-46d1-b742-cb533321bea1" \
            --embedsocial-ref "9abb7ef43c2b80e9cc04e6d7b00fb4d4ebd3e83b" \
            --limit 12 \
            --instagram-handle "@custrentoc5" \
            --tiktok-feed-url "https://rss-bridge.sans-nuage.fr/?action=display&bridge=TikTokBridge&context=By+user&username=%40custrentoc5&format=Json" \
            --tiktok-limit 12 \
            --tiktok-handle "@custrentoc5" \
            --feed content/social-feed.json

      - name: Validate JSON
        run: |
          python -m json.tool content/social-feed.json > /dev/null

      - name: Generate static SEO pages
        run: |
          python scripts/generate_static_pages.py
          test -f sitemap.xml
          test -f robots.txt

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -z "$(git status --porcelain -- content/social-feed.json img/social sitemap.xml robots.txt news squadra staff calendario classifica statistiche coppa matchday gallery video social club sponsor hall-of-fame contatti privacy cookies under-21)" ]; then
            echo "No social feed or SEO page changes to commit."
            exit 0
          fi

          git add -A content/social-feed.json img/social sitemap.xml robots.txt news squadra staff calendario classifica statistiche coppa matchday gallery video social club sponsor hall-of-fame contatti privacy cookies under-21
          git commit -m "Update social feed"

          BRANCH="${GITHUB_REF_NAME:-main}"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH"; then
              if git push origin HEAD:"$BRANCH"; then
                echo "Social feed update pushed."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep 3
          done

          echo "Push failed after 3 attempts."
          exit 1
