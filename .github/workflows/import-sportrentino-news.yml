name: Import SporTrentino CUS News

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pagine da scansionare. Usa 186 per import massivo, 1 per controllo giornaliero."
        required: false
        default: "1"
      sources:
        description: "Fonte da scansionare. Lascia all."
        required: false
        default: "all"
      sleep:
        description: "Pausa tra richieste articolo, in secondi"
        required: false
        default: "0.35"

  schedule:
    # Every night, off the exact half-hour.
    - cron: "37 3 * * *"

permissions:
  contents: write

concurrency:
  group: sportrentino-import-main
  cancel-in-progress: false

jobs:
  import-news:
    name: Import CUS Trento news from SporTrentino
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-sportrentino.txt

      - name: Run importer
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/import_sportrentino_news.py \
            --sources "${{ github.event.inputs.sources || 'all' }}" \
            --max-pages "${{ github.event.inputs.max_pages || '1' }}" \
            --sleep "${{ github.event.inputs.sleep || '0.35' }}"

      - name: Validate JSON
        run: |
          python -m json.tool content/data.json > /tmp/data.validated.json
          python -m json.tool content/news.imported.json > /tmp/news-imported.validated.json
          python -m json.tool content/news.index.json > /tmp/news-index.validated.json

      - name: Generate static SEO pages
        run: |
          python scripts/generate_static_pages.py
          test -f sitemap.xml
          test -f robots.txt
          test -d news

      - name: Commit imported news and SEO pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -z "$(git status --porcelain -- content/data.json content/news.imported.json content/news.index.json sitemap.xml robots.txt news squadra staff calendario classifica statistiche coppa matchday gallery video social club sponsor hall-of-fame contatti privacy cookies under-21)" ]; then
            echo "No new SporTrentino news or SEO pages to commit."
            exit 0
          fi

          git add -A content/data.json content/news.imported.json content/news.index.json sitemap.xml robots.txt news squadra staff calendario classifica statistiche coppa matchday gallery video social club sponsor hall-of-fame contatti privacy cookies under-21
          git commit -m "Import SporTrentino CUS news"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push completed."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "Push failed, retrying in 10 seconds..."
            sleep 10
          done

          echo "Push failed after 3 attempts."
          exit 1
