name: Site validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Admin V2 typecheck and tests (API, permissions, validation, data regression)
        run: |
          npm run cms:typecheck
          npm run cms:test

      - name: Validate JSON files
        run: |
          for file in content/*.json content/cms/*.json; do
            if [ -f "$file" ]; then
              python -m json.tool "$file" > /dev/null
            fi
          done

      - name: Validate scripts
        run: |
          python -m compileall scripts
          for file in js/*.js; do
            node --check "$file"
          done
          bash -n scripts/build_cloudflare_pages.sh

      - name: Check shared site rules (CMS files, routes, JS/Python slug parity)
        run: python scripts/check_site_consistency.py

      - name: Build Cloudflare Pages output
        env:
          CMS_V2_STRICT: "1"
        run: |
          npm run build
          test -f _site/admin-v2/index.html

      - name: Check generated SEO and security files
        run: |
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/_headers
          grep -q "X-Content-Type-Options" _site/_headers
          grep -q "X-Robots-Tag" _site/_headers
          grep -q "/admin-v2/\*" _site/_headers

  admin-v2-e2e:
    # Responsive and flow tests of Admin V2 in a phone, tablet and desktop
    # viewport, plus WebKit (Safari's engine) on iPhone.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        env:
          CMS_E2E_WEBKIT: "1"
        run: npm run cms:e2e
