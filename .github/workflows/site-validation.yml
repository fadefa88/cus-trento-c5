name: Site validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate JSON files
        run: |
          for file in content/*.json content/cms/*.json; do
            if [ -f "$file" ]; then
              python -m json.tool "$file" > /dev/null
            fi
          done

      - name: Validate scripts
        run: |
          python -m compileall scripts
          node --check js/app.js
          bash -n scripts/build_cloudflare_pages.sh

      - name: Build Cloudflare Pages output
        run: npm run build

      - name: Check generated SEO and security files
        run: |
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/_headers
          grep -q "X-Content-Type-Options" _site/_headers
          grep -q "X-Robots-Tag" _site/_headers
