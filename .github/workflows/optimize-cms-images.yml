name: Optimize CMS uploaded images and move to R2

on:
  workflow_dispatch:
    inputs:
      process_all_current_uploads:
        description: "Process ALL current img/uploads files too. Leave false to protect existing repository media."
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "img/uploads/**"
      - "content/cms/news.json"
      - "content/cms/roster.json"
      - "content/cms/gallery-albums.json"
      - "content/cms/sponsors.json"
      - "content/cms/staff.json"
      - "content/cms/club-history.json"
      - "content/data.json"
      - "content/data.generated.optional.json"

permissions:
  contents: write

concurrency:
  group: optimize-cms-images-r2-main
  cancel-in-progress: true

jobs:
  optimize-images:
    name: Convert new CMS images to WebP, upload to R2, update JSON
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Avoid a commit loop when this same workflow pushes JSON rewrites/removes local uploads.
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow boto3

      - name: Collect newly added CMS uploads
        id: changed_uploads
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/new-cms-uploads.txt

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.process_all_current_uploads }}" == "true" ]]; then
              git ls-files -- 'img/uploads' > /tmp/new-cms-uploads.txt
            fi
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              git diff-tree --no-commit-id --name-only -r --diff-filter=A "$AFTER" -- 'img/uploads/**' > /tmp/new-cms-uploads.txt || true
            else
              git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'img/uploads/**' > /tmp/new-cms-uploads.txt || true
            fi
          fi

          echo "New CMS uploads detected:"
          cat /tmp/new-cms-uploads.txt || true

          if [[ -s /tmp/new-cms-uploads.txt ]]; then
            echo "has_uploads=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_uploads=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Optimize uploads, send to R2 and rewrite JSON
        if: steps.changed_uploads.outputs.has_uploads == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_PREFIX: ${{ vars.R2_PREFIX || 'cms/uploads' }}
        run: |
          python scripts/upload_cms_images_to_r2.py --changed-files-list /tmp/new-cms-uploads.txt

      - name: Validate JSON
        if: steps.changed_uploads.outputs.has_uploads == 'true'
        run: |
          python -m json.tool content/data.json > /dev/null
          python -m json.tool content/data.generated.optional.json > /dev/null
          for file in content/cms/*.json; do
            python -m json.tool "$file" > /dev/null
          done

      - name: Commit R2 media references
        if: steps.changed_uploads.outputs.has_uploads == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No CMS media references to commit."
            exit 0
          fi

          git add -A img/uploads content/cms content/data.json content/data.generated.optional.json
          git commit -m "Move CMS uploaded images to R2"

          BRANCH="${GITHUB_REF_NAME:-main}"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin "$BRANCH"

            if git rebase "origin/$BRANCH"; then
              if git push origin HEAD:"$BRANCH"; then
                echo "R2 media references pushed."
                exit 0
              fi
            else
              echo "Rebase failed. Aborting."
              git rebase --abort || true
              exit 1
            fi

            echo "Push failed, retrying in 10 seconds..."
            sleep 10
          done

          echo "Push failed after 3 attempts."
          exit 1
