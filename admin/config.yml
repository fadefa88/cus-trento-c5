backend:
  name: github
  repo: fadefa88/cus-trento-c5
  branch: main
  base_url: https://decap-github-oauth.luca-defassi.workers.dev
  auth_endpoint: auth
  site_domain: https://custrentocalcioa5.it
locale: it
media_folder: img/uploads
public_folder: /img/uploads
collections:
- name: news
  label: News
  delete: false
  editor:
    preview: false
  files:
  - name: news
    label: News
    file: content/cms/news.json
    fields:
    - label: News
      name: news
      widget: list
      label_singular: articolo
      summary: '{{fields.title}}'
      fields:
      - label: ID
        name: id
        widget: number
        value_type: int
      - label: Titolo
        name: title
        widget: string
      - label: Categoria
        name: category
        widget: string
      - label: Tag
        name: tags
        widget: select
        multiple: true
        required: false
        options:
        - SporTrentino
        - Prima squadra
        - Under 21
        - Club
        - Matchday
        - U21
        - Analytics
      - label: Data
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
        picker_utc: false
      - label: Autore
        name: author
        widget: string
      - label: Immagine
        name: image
        widget: image
        choose_url: true
        required: false
      - label: Sommario
        name: excerpt
        widget: text
      - label: Corpo (un paragrafo per riga)
        name: body
        widget: list
        field:
          label: Paragrafo
          name: p
          widget: text
        required: false
        hint: Campo semplice compatibile con le news esistenti. Per alternare testo e immagini usa i blocchi articolo sotto.
      - label: Blocchi articolo (testo e immagini)
        name: contentBlocks
        widget: list
        required: false
        collapsed: true
        summary: '{{fields.type}}'
        hint: Usa questi blocchi per costruire articoli con immagini tra i paragrafi. Se lasci vuoto questo campo, il sito
          usa il Corpo semplice sopra.
        fields:
        - label: Tipo blocco
          name: type
          widget: select
          options:
          - label: Paragrafo
            value: paragraph
          - label: Immagine
            value: image
          default: paragraph
        - label: Testo paragrafo
          name: text
          widget: text
          required: false
        - label: Immagine
          name: image
          widget: image
          choose_url: true
          required: false
        - label: Didascalia immagine
          name: caption
          widget: string
          required: false
      - label: In evidenza
        name: pinned
        widget: boolean
        default: false
- name: roster
  label: Rosa giocatori
  delete: false
  editor:
    preview: false
  files:
  - name: roster
    label: Rosa giocatori
    file: content/cms/roster.json
    fields:
    - label: Rosa
      name: roster
      widget: list
      label_singular: giocatore
      summary: '#{{fields.number}} {{fields.name}} ({{fields.team}})'
      fields:
      - label: ID
        name: id
        widget: number
        value_type: int
      - label: Nome
        name: name
        widget: string
      - label: Ruolo
        name: role
        widget: select
        options:
        - Portiere
        - Centrale
        - Laterale
        - Pivot
        - Universale
      - label: Squadra
        name: team
        widget: select
        options:
        - Prima squadra
        - Under 21
      - label: Numero
        name: number
        widget: number
        value_type: int
      - label: Data di nascita
        name: birthDate
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
        picker_utc: false
        required: false
      - label: Luogo di nascita
        name: birthPlace
        widget: string
        required: false
      - label: Facoltà universitaria
        name: faculty
        widget: string
        required: false
      - label: Foto
        name: photo
        widget: image
        choose_url: true
        required: false
      hint: 'Le statistiche non si modificano qui: presenze, gol, ammonizioni, espulsioni e gol subiti sono calcolati automaticamente
        dai match terminati.'
