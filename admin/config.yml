# Configurazione Decap CMS — CUS Trento C5
# Generato in stile esteso (block) per evitare errori di sintassi.
# Modifica UN solo file: content/data.json

backend:
  name: git-gateway
  branch: main
media_folder: img/uploads
public_folder: img/uploads
locale: it
collections:
  - name: sito
    label: Contenuti del sito
    delete: false
    editor:
      preview: false
    files:
      - name: news
        label: News
        file: content/data.json
        fields:
          - label: News
            name: news
            widget: list
            label_singular: articolo
            summary: "{{fields.title}}"
            fields:
              - label: ID
                name: id
                widget: number
                value_type: int
              - label: Titolo
                name: title
                widget: string
              - label: Categoria
                name: category
                widget: string
              - label: Data
                name: date
                widget: date
                format: YYYY-MM-DD
              - label: Autore
                name: author
                widget: string
              - label: Immagine (URL)
                name: image
                widget: string
                required: false
              - label: Sommario
                name: excerpt
                widget: text
              - label: Corpo (un paragrafo per riga)
                name: body
                widget: list
                field:
                  label: Paragrafo
                  name: p
                  widget: text
              - label: In evidenza
                name: pinned
                widget: boolean
                default: false
      - name: roster
        label: Rosa giocatori
        file: content/data.json
        fields:
          - label: Rosa
            name: roster
            widget: list
            label_singular: giocatore
            summary: "#{{fields.number}} {{fields.name}} ({{fields.team}})"
            fields:
              - label: ID
                name: id
                widget: number
                value_type: int
              - label: Nome
                name: name
                widget: string
              - label: Ruolo
                name: role
                widget: select
                options:
                  - Portiere
                  - Centrale
                  - Laterale
                  - Punta
              - label: Squadra
                name: team
                widget: select
                options:
                  - Prima squadra
                  - Under 21
              - label: Numero
                name: number
                widget: number
                value_type: int
              - label: Eta'
                name: age
                widget: number
                value_type: int
                required: false
              - label: Gol
                name: goals
                widget: number
                value_type: int
                default: 0
              - label: Assist
                name: assists
                widget: number
                value_type: int
                default: 0
              - label: Presenze
                name: appearances
                widget: number
                value_type: int
                default: 0
              - label: Sigla avatar
                name: avatar
                widget: string
                required: false
              - label: Foto (URL)
                name: photo
                widget: string
                required: false
              - label: Bio
                name: bio
                widget: text
                required: false
              - label: Statistiche per competizione
                name: competitions
                widget: object
                required: false
                collapsed: true
                fields:
                  - label: Campionato
                    name: campionato
                    widget: object
                    fields:
                      - label: Presenze
                        name: appearances
                        widget: number
                        value_type: int
                      - label: Gol
                        name: goals
                        widget: number
                        value_type: int
                      - label: Assist
                        name: assists
                        widget: number
                        value_type: int
                  - label: Coppa
                    name: coppa
                    widget: object
                    fields:
                      - label: Presenze
                        name: appearances
                        widget: number
                        value_type: int
                      - label: Gol
                        name: goals
                        widget: number
                        value_type: int
                      - label: Assist
                        name: assists
                        widget: number
                        value_type: int
