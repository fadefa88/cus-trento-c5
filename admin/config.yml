                widget: list
                required: false
                collapsed: true
                fields:
                  - label: Stagione
                    name: season
                    widget: string
                  - label: Squadra
                    name: team
                    widget: string
                  - label: Presenze
                    name: appearances
                    widget: number
                    value_type: int
                  - label: Gol
                    name: goals
                    widget: number
                    value_type: int
                  - label: Assist
                    name: assists
                    widget: number
                    value_type: int
              - label: Statistiche portiere
                name: goalkeeperStats
