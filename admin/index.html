<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CUS Trento C5 — Admin</title>
</head>
<body>
  <!-- carica Decap CMS in manual init per integrare campi runtime senza duplicare config.yml -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="/js/site-core.js?v=site-core-v1"></script>
  <script src="custom.js?v=opponent-lineup-v1"></script>
  <script>
    (function(){
      function plain(value){ return value && typeof value.toJS === "function" ? value.toJS() : value; }
      function get(target,key){ return target && typeof target.get === "function" ? target.get(key) : target && target[key]; }
      function set(target,key,value){ return target && typeof target.set === "function" ? target.set(key,value) : Object.assign({}, target || {}, {[key]:value}); }
      function emptyList(){
        var immutable = window.Immutable || (window.CMS && window.CMS.Immutable);
        return immutable && typeof immutable.List === "function" ? immutable.List() : [];
      }
      function emptyMap(){
        var immutable = window.Immutable || (window.CMS && window.CMS.Immutable);
        return immutable && typeof immutable.Map === "function" ? immutable.Map() : {};
      }
      function isDraftMatch(match){
        var status = String(get(match,"status") || "").toLowerCase();
        return !status || status.indexOf("giocare") !== -1 || status.indexOf("programm") !== -1;
      }
      function fixMatch(match){
        if(!match || !isDraftMatch(match)) return match;
        var lineup = get(match,"lineup") || emptyMap();
        ["startingFive","bench","suspended","injured"].forEach(function(field){
          var value = get(lineup,field);
          if(value == null || value === "") lineup = set(lineup,field,emptyList());
        });
        return set(match,"lineup",lineup);
      }
      function fixList(list){
        if(!list) return list;
        if(Array.isArray(list)) return list.map(fixMatch);
        if(typeof list.map === "function") return list.map(fixMatch);
        return list;
      }
      function register(){
        if(!window.CMS || typeof window.CMS.registerEventListener !== "function") return false;
        window.CMS.registerEventListener({
          name:"preSave",
          handler:function(ctx){
            var entry = ctx && ctx.entry;
            var data = entry && typeof entry.getIn === "function" ? entry.getIn(["data"]) : entry && typeof entry.get === "function" ? entry.get("data") : entry && entry.data;
            if(!data) return data;
            var next = data;
            ["fixtures","u21Fixtures"].forEach(function(key){
              var current = get(next,key);
              if(current) next = set(next,key,fixList(current));
            });
            return next;
          }
        });
        return true;
      }
      if(!register()) document.addEventListener("DOMContentLoaded", register);
      setTimeout(register,500);
    })();
  </script>
  <script>
    (function(){
      function opponentLogoField(){
        return {
          label:"Logo avversaria",
          name:"opponentLogo",
          widget:"image",
          choose_url:true,
          required:false,
          hint:"Carica il logo della squadra avversaria: nella fascia prossime partite il logo CUS Trento resta automatico."
        };
      }

      function collectionMatchFields(config, collectionName){
        var collections = config && config.collections;
        if(!Array.isArray(collections)) return null;
        var collection = collections.find(function(item){ return item && item.name === collectionName; });
        var file = collection && Array.isArray(collection.files) && collection.files[0];
        var listField = file && Array.isArray(file.fields) && file.fields.find(function(field){ return field && field.name === collectionName; });
        return listField && Array.isArray(listField.fields) ? listField.fields : null;
      }

      function namedField(fields, name){
        return Array.isArray(fields) ? fields.find(function(field){ return field && field.name === name; }) : null;
      }

      function optionKey(option){
        if(option && typeof option === "object") return String(option.value != null ? option.value : option.label || "");
        return String(option == null ? "" : option);
      }

      function mergedOptions(primary, secondary){
        var result = [];
        var seen = Object.create(null);
        [primary || [], secondary || []].forEach(function(options){
          options.forEach(function(option){
            var key = optionKey(option);
            if(!key || seen[key]) return;
            seen[key] = true;
            result.push(option);
          });
        });
        return result;
      }

      function mergeSelectOptions(firstField, u23Field){
        if(!firstField || !u23Field) return;
        var options = mergedOptions(firstField.options, u23Field.options);
        firstField.options = options.slice();
        u23Field.options = options.slice();
      }

      function eventPlayerField(matchFields, eventName){
        var eventField = namedField(matchFields, eventName);
        return eventField && Array.isArray(eventField.fields) ? namedField(eventField.fields, "playerId") : null;
      }

      function expandCrossTeamPlayerOptions(config){
        var firstFields = collectionMatchFields(config, "fixtures");
        var u23Fields = collectionMatchFields(config, "u21Fixtures");
        if(!firstFields || !u23Fields) return;

        var firstLineup = namedField(firstFields, "lineup");
        var u23Lineup = namedField(u23Fields, "lineup");
        var firstLineupFields = firstLineup && firstLineup.fields;
        var u23LineupFields = u23Lineup && u23Lineup.fields;

        ["startingFive","bench","suspended","injured"].forEach(function(name){
          mergeSelectOptions(namedField(firstLineupFields, name), namedField(u23LineupFields, name));
        });

        ["scorerEvents","yellowCardEvents","redCardEvents","goalkeeperEvents"].forEach(function(name){
          mergeSelectOptions(eventPlayerField(firstFields, name), eventPlayerField(u23Fields, name));
        });
      }

      function playerTeamLabel(team){
        return String(team || "").toLowerCase().indexOf("under") !== -1 ? "U23" : "Prima";
      }

      function playerOptions(roster, goalkeepersOnly){
        return (Array.isArray(roster) ? roster : [])
          .filter(function(player){
            if(!player || player.id == null || !player.name) return false;
            return !goalkeepersOnly || String(player.role || "").toLowerCase() === "portiere";
          })
          .slice()
          .sort(function(a,b){
            var teamA = playerTeamLabel(a.team) === "Prima" ? 0 : 1;
            var teamB = playerTeamLabel(b.team) === "Prima" ? 0 : 1;
            if(teamA !== teamB) return teamA - teamB;
            var numberA = Number(a.number);
            var numberB = Number(b.number);
            if(Number.isFinite(numberA) && Number.isFinite(numberB) && numberA !== numberB) return numberA - numberB;
            return String(a.name).localeCompare(String(b.name), "it");
          })
          .map(function(player){
            var number = player.number != null && player.number !== "" ? "#" + player.number + " " : "";
            return {
              label:number + player.name + " · " + playerTeamLabel(player.team),
              value:String(player.id)
            };
          });
      }

      function setOptions(field, options, ownGoal){
        if(!field) return;
        field.options = options.slice();
        if(ownGoal) field.options.push({label:"Autogol (avversario)", value:"autogol"});
      }

      function applyRosterOptionsToMatchFields(matchFields, allPlayers, goalkeepers){
        if(!matchFields) return;
        var lineup = namedField(matchFields, "lineup");
        var lineupFields = lineup && lineup.fields;
        ["startingFive","bench","suspended","injured"].forEach(function(name){
          setOptions(namedField(lineupFields, name), allPlayers, false);
        });
        setOptions(eventPlayerField(matchFields, "scorerEvents"), allPlayers, true);
        setOptions(eventPlayerField(matchFields, "yellowCardEvents"), allPlayers, false);
        setOptions(eventPlayerField(matchFields, "redCardEvents"), allPlayers, false);
        setOptions(eventPlayerField(matchFields, "goalkeeperEvents"), goalkeepers, false);
      }

      function syncPlayerOptionsFromRoster(config, roster){
        if(!Array.isArray(roster) || !roster.length){
          expandCrossTeamPlayerOptions(config);
          return;
        }
        var allPlayers = playerOptions(roster, false);
        var goalkeepers = playerOptions(roster, true);
        applyRosterOptionsToMatchFields(collectionMatchFields(config, "fixtures"), allPlayers, goalkeepers);
        applyRosterOptionsToMatchFields(collectionMatchFields(config, "u21Fixtures"), allPlayers, goalkeepers);
      }

      function addOpponentLogoField(config, collectionName){
        var collections = config && config.collections;
        if(!Array.isArray(collections)) return;
        var collection = collections.find(function(item){ return item && item.name === collectionName; });
        var file = collection && Array.isArray(collection.files) && collection.files[0];
        var listField = file && Array.isArray(file.fields) && file.fields.find(function(field){ return field && field.name === collectionName; });
        var fields = listField && Array.isArray(listField.fields) && listField.fields;
        if(!fields || fields.some(function(field){ return field && field.name === "opponentLogo"; })) return;
        var awayIndex = fields.findIndex(function(field){ return field && field.name === "away"; });
        fields.splice(awayIndex >= 0 ? awayIndex + 1 : fields.length, 0, opponentLogoField());
      }

      function addU23OpponentScorers(config){
        var fields = collectionMatchFields(config, "u21Fixtures");
        if(!fields || namedField(fields, "opponentScorerEvents")) return;
        var field = {
          label:"Marcatori avversari (solo visualizzazione)",
          name:"opponentScorerEvents",
          widget:"list",
          required:false,
          collapsed:true,
          summary:"{{fields.name}} — {{fields.goals}} gol",
          hint:"Solo per la singola partita Under 23: inserisci nome e numero di gol del marcatore avversario. Non vengono richiesti i minuti e questi dati non modificano statistiche, storico marcatori o dati giocatore.",
          fields:[
            {label:"Nome marcatore avversario", name:"name", widget:"string"},
            {label:"Reti", name:"goals", widget:"number", value_type:"int", default:1, min:1, required:true}
          ]
        };
        var scorerIndex = fields.findIndex(function(item){ return item && item.name === "scorerEvents"; });
        fields.splice(scorerIndex >= 0 ? scorerIndex + 1 : fields.length, 0, field);
      }


      // Autocompletamento CUS Trento League: mantiene stringhe e JSON esistenti.
      // HTML datalist permette anche nomi nuovi non ancora presenti nelle rose.
      function registerLeagueAutocomplete(){
        if(window.__cusLeagueAutocompleteRegistered) return true;
        var render = window.h;
        if(!window.CMS || typeof window.CMS.registerWidget !== "function" || typeof render !== "function") return false;

        function LeagueAutocompleteControl(props){
          var raw = props.field && typeof props.field.get === "function" ? props.field.get("suggestions") : [];
          var choices = raw && typeof raw.toJS === "function" ? raw.toJS() : raw;
          if(!Array.isArray(choices)) choices = [];
          var id = String(props.forID || "league-autocomplete");
          var datalistId = id + "-suggestions";
          return render("div", {className:"cms-league-autocomplete"}, [
            render("input", {
              key:"input",
              id:id,
              className:props.classNameWrapper,
              type:"text",
              list:datalistId,
              value:props.value == null ? "" : String(props.value),
              onChange:function(event){ props.onChange(event.target.value); },
              autoComplete:"off",
              spellCheck:false
            }),
            render("datalist", {key:"list",id:datalistId}, choices.map(function(choice,index){
              return render("option", {
                key:String(index),
                value:String(choice.value || ""),
                label:String(choice.label || choice.value || "")
              });
            }))
          ]);
        }
        window.CMS.registerWidget("league-autocomplete", LeagueAutocompleteControl);
        window.__cusLeagueAutocompleteRegistered = true;
        return true;
      }

      function leagueChoices(league){
        var teamChoices = [], playerChoices = [], seenTeams = Object.create(null), seenPlayers = Object.create(null);
        function addTeam(name){
          var value=String(name || "").trim(), key=value.toLocaleLowerCase("it");
          if(!value || seenTeams[key]) return;
          seenTeams[key]=true;
          teamChoices.push({value:value,label:value});
        }
        function addPlayer(name,team,number){
          var value=String(name || "").trim(), owner=String(team || "").trim();
          var key=value.toLocaleLowerCase("it") + "|" + owner.toLocaleLowerCase("it");
          if(!value || seenPlayers[key]) return;
          seenPlayers[key]=true;
          var details = owner ? owner + (number ? " · #" + number : "") : "Già usato in calendario";
          playerChoices.push({value:value,label:value + " — " + details});
        }
        (Array.isArray(league.teams) ? league.teams : []).forEach(function(team){
          addTeam(team.name);
          (Array.isArray(team.players) ? team.players : []).forEach(function(player){
            addPlayer(typeof player === "string" ? player : player.name, team.name, player.number);
          });
        });
        (Array.isArray(league.matches) ? league.matches : []).forEach(function(match){
          addTeam(match.home);
          addTeam(match.away);
          (Array.isArray(match.scorers) ? match.scorers : []).forEach(function(item){
            addTeam(item.team);
            addPlayer(item.name,item.team,"");
          });
        });
        addPlayer("Autogol","","");
        teamChoices.sort(function(a,b){return a.value.localeCompare(b.value,"it");});
        playerChoices.sort(function(a,b){
          if(a.value === "Autogol") return -1;
          if(b.value === "Autogol") return 1;
          return a.value.localeCompare(b.value,"it") || a.label.localeCompare(b.label,"it");
        });
        return {teams:teamChoices,players:playerChoices};
      }

      function applyLeagueAutocomplete(config,league){
        if(!registerLeagueAutocomplete()) {
          console.warn("Widget autocompletamento League non disponibile: restano i campi di testo.");
          return;
        }
        var collections = config && config.collections;
        var events = Array.isArray(collections) && collections.find(function(item){return item && item.name === "events";});
        var file = events && Array.isArray(events.files) && events.files[0];
        var fields = file && file.fields;
        var leagueField = namedField(fields,"cusTrentoLeague");
        var matches = namedField(leagueField && leagueField.fields,"matches");
        var matchFields = matches && matches.fields;
        if(!Array.isArray(matchFields)) return;
        var scorers = namedField(matchFields,"scorers");
        var scorerFields = scorers && scorers.fields;
        var choices = leagueChoices(league || {});

        function bind(field,options,hint){
          if(!field) return;
          field.widget = "league-autocomplete";
          field.suggestions = options.map(function(option){return {value:option.value,label:option.label};});
          field.hint = hint;
        }
        bind(namedField(matchFields,"home"),choices.teams,
          "Digita per cercare una squadra già inserita. Puoi anche scrivere una nuova squadra.");
        bind(namedField(matchFields,"away"),choices.teams,
          "Digita per cercare una squadra già inserita. Puoi anche scrivere una nuova squadra.");
        bind(namedField(scorerFields,"name"),choices.players,
          "Digita il nome: vengono suggeriti i giocatori delle rose e i marcatori già salvati, con la squadra di appartenenza. Autogol rimane disponibile.");
        bind(namedField(scorerFields,"team"),choices.teams,
          "Seleziona la squadra a cui è attribuito il gol (casa o trasferta). Puoi cercarla digitandone il nome.");
      }

      function loadLeague(){
        return fetch("/content/cms/events.json?cms=" + Date.now(), {cache:"no-store"})
          .then(function(response){
            if(!response.ok) throw new Error("Dati League non caricabili: " + response.status);
            return response.json();
          })
          .then(function(payload){return payload && payload.cusTrentoLeague || {};})
          .catch(function(error){
            console.warn("Dati League non caricati: autocompletamento con inserimento libero.",error);
            return {};
          });
      }

      function initCms(config, roster, league){
        syncPlayerOptionsFromRoster(config, roster);
        addOpponentLogoField(config, "fixtures");
        addOpponentLogoField(config, "u21Fixtures");
        addU23OpponentScorers(config);
        applyLeagueAutocomplete(config, league);
        config.load_config_file = false;
        window.CMS.init({config:config});
      }

      function loadRoster(){
        return fetch("/content/cms/roster.json?cms=" + Date.now(), {cache:"no-store"})
          .then(function(response){
            if(!response.ok) throw new Error("Rosa CMS non caricabile: " + response.status);
            return response.json();
          })
          .then(function(payload){ return payload && Array.isArray(payload.roster) ? payload.roster : []; })
          .catch(function(error){
            console.warn("Rosa dinamica non caricata: uso le opzioni presenti in config.yml.", error);
            return [];
          });
      }

      function boot(){
        if(!window.CMS || typeof window.CMS.init !== "function") return setTimeout(boot, 100);
        if(!window.jsyaml || typeof window.jsyaml.load !== "function"){
          console.warn("js-yaml non caricato: avvio CMS con config standard.");
          window.CMS.init();
          return;
        }
        Promise.all([
          fetch("config.yml", {cache:"no-store"}).then(function(response){
            if(!response.ok) throw new Error("Config CMS non caricabile: " + response.status);
            return response.text();
          }),
          loadRoster(),
          loadLeague()
        ])
          .then(function(results){ initCms(window.jsyaml.load(results[0]), results[1], results[2]); })
          .catch(function(error){
            console.error(error);
            window.CMS.init();
          });
      }

      boot();
    })();
  </script>
</body>
</html>
