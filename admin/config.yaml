backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"      # dove finiscono le foto caricate
public_folder: "/img/uploads"

collections:
  - name: "news"
    label: "News"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Categoria", name: "category", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Autore", name: "author", widget: "string" }
      - { label: "Immagine", name: "image", widget: "image", required: false }
      - { label: "Sommario", name: "excerpt", widget: "text" }
      - { label: "Testo", name: "body", widget: "markdown" }
      - { label: "In evidenza", name: "pinned", widget: "boolean", default: false }

  - name: "roster"
    label: "Rosa"
    folder: "content/roster"
    create: true
    fields:
      - { label: "Nome", name: "name", widget: "string" }
      - { label: "Ruolo", name: "role", widget: "select", options: ["Portiere","Centrale","Laterale","Punta"] }
      - { label: "Squadra", name: "team", widget: "select", options: ["Prima squadra","Under 21"] }
      - { label: "Numero", name: "number", widget: "number" }
      - { label: "Gol", name: "goals", widget: "number", default: 0 }
      - { label: "Assist", name: "assists", widget: "number", default: 0 }
      - { label: "Presenze", name: "appearances", widget: "number", default: 0 }
      - { label: "Foto", name: "photo", widget: "image", required: false }
      - { label: "Bio", name: "bio", widget: "text", required: false }

  - name: "standings"
    label: "Classifica"
    files:
      - name: "prima"
        label: "Classifica Prima squadra"
        file: "content/standings-prima.json"
        fields:
          - label: "Squadre"
            name: "rows"
            widget: "list"
            fields:
              - { label: "Posizione", name: "pos", widget: "number" }
              - { label: "Squadra", name: "team", widget: "string" }
              - { label: "Punti", name: "pts", widget: "number" }
              - { label: "Giocate", name: "g", widget: "number" }
              - { label: "Vinte", name: "v", widget: "number" }
              - { label: "Nulle", name: "n", widget: "number" }
              - { label: "Perse", name: "p", widget: "number" }
              - { label: "Gol fatti", name: "gf", widget: "number" }
              - { label: "Gol subiti", name: "gs", widget: "number" }
